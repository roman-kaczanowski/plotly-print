[project]
name = "plotly-print"
version = "0.1.0"
description = "Lightweight, browser-less static image exporter for Plotly"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [
    { name = "Roman Kaczanowski", email = "roman.kaczanowski.pl@gmail.com" },
]
requires-python = ">=3.12"
dependencies = [
    "plotly>=5.0.0",
    "quickjs>=1.19.0",
    "pillow>=9.0.0",
    "resvg-py>=0.4.0",
]
keywords = ["plotly", "kaleido", "export", "svg", "png", "visualization", "headless"]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Visualization",
]

[project.urls]
Homepage = "https://github.com/roman-kaczanowski/plotly-print"
Repository = "https://github.com/roman-kaczanowski/plotly-print"
Issues = "https://github.com/roman-kaczanowski/plotly-print/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plotly_print"]

[tool.uv]
default-groups = ["dev", "test"]


[dependency-groups]
dev = ["ruff", "ipython", "pre-commit", "poethepoet", "mdformat", "mdformat-gfm", "mdformat-tables"]
test = ["pytest", "numpy>=1.24.0", "pandas>=2.0.0"]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "N",
    "UP",
    # "PL",
    # "RUF",
]
extend-select = ["I"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.poe]
executor = { type = "uv" }
shell_interpreter = "bash"

[tool.poe.tasks]
lock = "uv lock"

install = "uv sync"

hooks = "pre-commit install"
update = "uv lock --upgrade"
upgrade.sequence = ["update", "install"]
format = [{ cmd = "ruff format ." }, { cmd = "ruff check . --fix" }]
check = [{ cmd = "ruff format . --check" }, { cmd = "ruff check ." }]
test = "pytest"
format_docs = { shell = "git ls-files '*.md' | xargs mdformat" }
check_docs = { shell = "git ls-files '*.md' | xargs mdformat --check" }
patch = "uv version --bump patch"
minor = "uv version --bump minor"
major = "uv version --bump major"
